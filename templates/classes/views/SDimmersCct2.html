<script type="text/javascript">

	/**
	 * ============================================================
	 * Dimmer Widget для MajorDoMo
	 * ============================================================
	 *
	 * Описание:
	 * Скрипт управляет яркостью и цветовой температурой (CCT) лампы.
	 * Использует глобальный объект window.dimmer для хранения состояния каждой лампы.
	 *
	 * Плейсхолдеры, заменяемые сервером:
	 * %.object_id%          - уникальный ID лампы
	 * %.object_title%       - название объекта в MajorDoMo
	 * %.level%              - яркость (0-100)
	 * %.cct%                - цветовая температура (0-100)
	 * %.loadType%           - тип загрузки виджета
	 * %.status%             - статус лампы (on/off)
	 * %.icon%               - иконка устройства
	 * %.object_description% - описание устройства
	 *
	 * ============================================================
	 * Глобальный объект лампы:
	 * window.dimmer[object_id] = {
	 *   level: number,           // яркость белого света (0-100)
	 *   cct: number,             // цветовая температура (0-100)
	 *   dragging: boolean,       // флаг перетаскивания
	 *   brightnessTimeout: number|null, // таймер debounce яркости
	 *   cctTimeout: number|null         // таймер debounce CCT
	 * }
	 *
	 * ============================================================
	 * Функции:
	 *
	 * previewBrightness%.object_id%(val)
	 *   - Предварительный просмотр изменения яркости белого света.
	 *   - @param {number|string} val - значение яркости (0-100)
	 *
	 * sendNewBrightness%.object_id%()
	 *   - Отправка нового значения яркости на сервер (debounce 500ms)
	 *
	 * previewCct%.object_id%(val)
	 *   - Предварительный просмотр изменения цветовой температуры.
	 *   - @param {number|string} val - значение CCT (0-100)
	 *
	 * sendNewCct%.object_id%()
	 *   - Отправка нового значения CCT на сервер (debounce 500ms)
	 *
	 * updateSliderFill(selector, value, color)
	 *   - Обновляет фон слайдера в зависимости от значения.
	 *   - @param {string} selector - CSS-селектор input[type=range]
	 *   - @param {number} value - значение ползунка (0-100)
	 *   - @param {string} color - цвет до текущего значения
	 *
	 */
	 
	// Создаем глобальный объект dimmer, если его нет
	if (typeof window.dimmer === 'undefined') window.dimmer = {};

	// Создаем объект для этой лампы, если его нет
	if (typeof window.dimmer%.object_id% === 'undefined') {
		window.dimmer%.object_id% = {
			level: %.level%,
			cct: %.cct%,
			dragging: false,
			brightnessTimeout: null,
			cctTimeout: null
		};
	}

	// --- Яркость ---
	function previewBrightness%.object_id%(val) {
		val = parseInt(val);
		let lamp = window.dimmer%.object_id%;
		lamp.dragging = true;
		lamp.level = val;
		$('#dimmer%.object_id%_bright').text("Яркость: " + val + "%");
		updateSliderFill('#dimmerSelect%.object_id%_bright', val, '#4CAF50');
	}

	function sendNewBrightness%.object_id%() {
		let lamp = window.dimmer%.object_id%;
		lamp.dragging = false;
		clearTimeout(lamp.brightnessTimeout);
		lamp.brightnessTimeout = setTimeout(() => {
			callMethod('%.object_title%.setLevel', 'value=' + lamp.level);
		}, 500);
	}

	// --- Цветовая температура ---
	function previewCct%.object_id%(val) {
		val = parseInt(val);
		let lamp = window.dimmer%.object_id%;
		lamp.dragging = true;
		lamp.cct = val;
		$('#dimmer%.object_id%_cct').text("Температура: " + val + "%");
		updateSliderFill('#dimmerSelect%.object_id%_cct', val, '#f7a800');
	}

	function sendNewCct%.object_id%() {
		let lamp = window.dimmer%.object_id%;
		lamp.dragging = false;
		clearTimeout(lamp.cctTimeout);
		lamp.cctTimeout = setTimeout(() => {
			callMethod('%.object_title%.setCct', 'value=' + lamp.cct);
		}, 500);
	}

	// --- Обновление фона слайдера ---
	function updateSliderFill(selector, value, color) {
		const slider = document.querySelector(selector);
		if (!slider) return;
		slider.style.background = `linear-gradient(90deg, ${color} ${value}%, #ddd ${value}%)`;
	}

	// Инициализация фона ползунков при загрузке
	$(document).ready(function() {
		updateSliderFill('#dimmerSelect%.object_id%_bright', %.level%, '#4CAF50');
		updateSliderFill('#dimmerSelect%.object_id%_cct', %.cct%, '#f7a800');
	});
</script>

<style>
.card {
  background: #fff;
  border-radius: 16px;
  padding: 20px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.1);
  margin: 20px 0 20px 50px;
  max-width: 320px;
  font-family: "Segoe UI", sans-serif;
}

.device-details p {
  margin: 8px 0 4px;
  font-weight: 500;
  color: #333;
}

input[type=range] {
  width: 100%;
  height: 8px;
  border-radius: 5px;
  outline: none;
  background: linear-gradient(90deg, #ddd 0%, #ddd 0%);
  transition: background 0.2s ease;
  -webkit-appearance: none;
}

input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: white;
  border: 3px solid currentColor;
  box-shadow: 0 0 6px rgba(0,0,0,0.3);
  cursor: pointer;
  transition: transform 0.15s ease;
}

input[type=range]::-webkit-slider-thumb:hover {
  transform: scale(1.2);
}

#dimmerSelect%.object_id%_bright {
  color: #4CAF50;
}

#dimmerSelect%.object_id%_cct {
  color: #f7a800;
}
</style>

<div class="device-widget controller loadtype_%.loadType%">
 <div onClick='$("#icon%.object_id%_light").addClass("pressed");setTimeout("$(\"#icon%.object_id%_light\").removeClass(\"pressed\");",300);callMethod("%.object_title%.switch");'>
  <div class="device-icon %.status|"off;on"%" id="icon%.object_id%_light" style='%.icon|"background-image:url(%.icon%)"%'></div>
  <div class="device-header">%.object_description%</div>
 </div>
</div>

<div class="card">
  <div class="device-details">
    <p id="dimmer%.object_id%_bright">Яркость: %.level%%</p>
    <input id="dimmerSelect%.object_id%_bright" 
           type="range" min="1" max="100" step="1"
           value="%.level%" 
           oninput="previewBrightness%.object_id%(this.value)"
           onmouseup="sendNewBrightness%.object_id%()"
           ontouchend="sendNewBrightness%.object_id%()">

    <p id="dimmer%.object_id%_cct">Температура: %.cct%%</p>
    <input id="dimmerSelect%.object_id%_cct" 
           type="range" min="1" max="100" step="1"
           value="%.cct%" 
           oninput="previewCct%.object_id%(this.value)"
           onmouseup="sendNewCct%.object_id%()"
           ontouchend="sendNewCct%.object_id%()">
  </div>
</div>

<script>
// Инициализация фона ползунков при загрузке
updateSliderFill('#dimmerSelect%.object_id%_bright', %.level%, '#4CAF50');
updateSliderFill('#dimmerSelect%.object_id%_cct', %.cct%, '#f7a800');
</script>
