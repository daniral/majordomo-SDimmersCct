<script type="text/javascript">
/**
 * ============================================================
 * Управление лампой с яркостью и цветовой температурой (CCT)
 * ============================================================
 *
 * Глобальный объект:
 *   window.dimmer%.object_id% - состояние лампы
 *     - level: яркость (0-100)
 *     - cct: цветовая температура (0-100)
 *     - dragging: флаг перетаскивания слайдера
 *
 * Функции:
 *   previewBrightness%.object_id%(val) - обновляет яркость при движении ползунка
 *   sendNewBrightness%.object_id%()    - отправляет новое значение яркости на сервер
 *   previewCct%.object_id%(val)        - обновляет CCT при движении ползунка
 *   sendNewCct%.object_id%()           - отправляет новое значение CCT на сервер
 *   updateSliderFill(selector, value, color) - визуально обновляет фон ползунка
 *   updateFromServer(level, cct)       - синхронизирует значения с сервера
 *
 * HTML-структура:
 *   - div.card - контейнер с ползунками
 *   - p#dimmer%.object_id%_bright - текст яркости
 *   - input#dimmerSelect%.object_id%_bright - слайдер яркости
 *   - p#dimmer%.object_id%_cct - текст CCT
 *   - input#dimmerSelect%.object_id%_cct - слайдер CCT
 *
 * Используется debounce 200ms для отправки изменений.
 * Ползунки обновляются с учетом пользовательского взаимодействия.
 */

// Проверяем, существует ли объект dimmer для этой лампы
if (typeof window.dimmer === 'undefined') window.dimmer = {};
if (typeof window.dimmer%.object_id% === 'undefined') window.dimmer%.object_id% = {
  level: %.level%,
  cct: %.cct%,
  dragging: false
};

// --- Debounce функции ---
let brightnessTimeout%.object_id%;
let cctTimeout%.object_id%;

// --- Яркость ---
function previewBrightness%.object_id%(val) {
  val = parseInt(val);
  window.dimmer%.object_id%.dragging = true; // Пользователь тянет
  window.dimmer%.object_id%.level = val;
  $('#dimmer%.object_id%_bright').text("Яркость: " + val + "%");
  updateSliderFill('#dimmerSelect%.object_id%_bright', val, '#4CAF50');
}

function sendNewBrightness%.object_id%() {
  window.dimmer%.object_id%.dragging = false; // Отпустил
  clearTimeout(brightnessTimeout%.object_id%);
  brightnessTimeout%.object_id% = setTimeout(() => {
      callMethod('%.object_title%.setLevel', 'value=' + window.dimmer%.object_id%.level);
  }, 200); // debounce 200ms
}

// --- Цветовая температура ---
function previewCct%.object_id%(val) {
  val = parseInt(val);
  window.dimmer%.object_id%.dragging = true;
  window.dimmer%.object_id%.cct = val;
  $('#dimmer%.object_id%_cct').text("Температура: " + val + "%");
  updateSliderFill('#dimmerSelect%.object_id%_cct', val, '#f7a800');
}

function sendNewCct%.object_id%() {
  window.dimmer%.object_id%.dragging = false;
  clearTimeout(cctTimeout%.object_id%);
  cctTimeout%.object_id% = setTimeout(() => {
      callMethod('%.object_title%.setCct', 'value=' + window.dimmer%.object_id%.cct);
  }, 200); // debounce 200ms
}

// --- Обновление фона ползунка ---
function updateSliderFill(selector, value, color) {
  const slider = document.querySelector(selector);
  const percentage = value;
  slider.style.background = `linear-gradient(90deg, ${color} ${percentage}%, #ddd ${percentage}%)`;
}

// --- Обновление слайдера с сервера ---
function updateFromServer(level, cct) {
  if (!window.dimmer%.object_id%.dragging) { 
      window.dimmer%.object_id%.level = level;
      window.dimmer%.object_id%.cct = cct;

      $('#dimmer%.object_id%_bright').text("Яркость: " + level + "%");
      $('#dimmerSelect%.object_id%_bright').val(level);
      updateSliderFill('#dimmerSelect%.object_id%_bright', level, '#4CAF50');

      $('#dimmer%.object_id%_cct').text("Температура: " + cct + "%");
      $('#dimmerSelect%.object_id%_cct').val(cct);
      updateSliderFill('#dimmerSelect%.object_id%_cct', cct, '#f7a800');
  }
}
</script>

<style>
.card {
  background: #fff;
  border-radius: 16px;
  padding: 20px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.1);
  margin: 20px 0 20px 50px;
  max-width: 320px;
  font-family: "Segoe UI", sans-serif;
}

.device-details p {
  margin: 8px 0 4px;
  font-weight: 500;
  color: #333;
}

input[type=range] {
  width: 100%;
  height: 8px;
  border-radius: 5px;
  outline: none;
  background: linear-gradient(90deg, #ddd 0%, #ddd 0%);
  transition: background 0.2s ease;
  -webkit-appearance: none;
}

input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: white;
  border: 3px solid currentColor;
  box-shadow: 0 0 6px rgba(0,0,0,0.3);
  cursor: pointer;
  transition: transform 0.15s ease;
}

input[type=range]::-webkit-slider-thumb:hover {
  transform: scale(1.2);
}

#dimmerSelect%.object_id%_bright {
  color: #4CAF50;
}

#dimmerSelect%.object_id%_cct {
  color: #f7a800;
}
</style>

<div class="device-widget controller loadtype_%.loadType%">
 <div onClick='$("#icon%.object_id%_light").addClass("pressed");setTimeout("$(\"#icon%.object_id%_light\").removeClass(\"pressed\");",300);callMethod("%.object_title%.switch");'>
  <div class="device-icon %.status|"off;on"%" id="icon%.object_id%_light" style='%.icon|"background-image:url(%.icon%)"%'></div>
  <div class="device-header">%.object_description%</div>
 </div>
</div>

<div class="card">
  <div class="device-details">
    <p id="dimmer%.object_id%_bright">Яркость: %.level%%</p>
    <input id="dimmerSelect%.object_id%_bright" 
           type="range" min="0" max="100" step="1"
           value="%.level%" 
           oninput="previewBrightness%.object_id%(this.value)"
           onmouseup="sendNewBrightness%.object_id%()"
           ontouchend="sendNewBrightness%.object_id%()">

    <p id="dimmer%.object_id%_cct">Температура: %.cct%%</p>
    <input id="dimmerSelect%.object_id%_cct" 
           type="range" min="0" max="100" step="1"
           value="%.cct%" 
           oninput="previewCct%.object_id%(this.value)"
           onmouseup="sendNewCct%.object_id%()"
           ontouchend="sendNewCct%.object_id%()">
  </div>
</div>

<script>
// Инициализация фона ползунков при загрузке
updateSliderFill('#dimmerSelect%.object_id%_bright', %.level%, '#4CAF50');
updateSliderFill('#dimmerSelect%.object_id%_cct', %.cct%, '#f7a800');
</script>
